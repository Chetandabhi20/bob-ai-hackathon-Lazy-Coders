# =============================================================================
# HACKATHON SUBMISSION METADATA
# =============================================================================
# Instructions:
#   - Fill in ALL required fields (marked with # REQUIRED)
#   - Optional fields can be left as empty strings ""
#   - Do NOT rename this file — the evaluation pipeline reads it by name
#   - Use double quotes around all string values
# =============================================================================

team:
  name: "Lazy Coders"                             # REQUIRED — e.g., "Orion Squad"
  track: "AI"                            # REQUIRED — one of: AI | DevOps | Sustainability | Open
  lead:
    name: "Chetan"                           # REQUIRED — e.g., "Alice Chen"
    email: "chetan@example.com"                          # REQUIRED — e.g., "alice.chen@ibm.com"
  members:
    - name: ""                         # REQUIRED — Team member 1
      email: ""

submission:
  title: "Grid Guardian"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Electrical grid operators struggle to predict equipment failures and proactively deploy maintenance crews, leading to widespread outages, costly emergency repairs, and increased risks to critical infrastructure.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Grid Guardian is an AI-powered electrical-grid risk-assessment tool that predicts equipment failures and scores the downstream "blast radius" impact. It provides actionable crew pre-positioning plans and a watsonx-powered narrative interface via an MCP server integration.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Predictive failure modeling based on sensor telemetry"
    - "Blast-radius scoring to prioritize high-impact outages"
    - "Geospatial crew pre-positioning algorithm"
    - "watsonx.ai narrative layer for actionable incident briefs"
    - "Interactive Vite+React dashboard for grid visualization"

  tech_stack:
    languages: ["Python", "JavaScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: []                      # e.g., ["PostgreSQL", "Redis"]
    other: ["FastMCP"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The Blast-Radius Scoring System combined with live weather fusion. Most
    ML-based grid tools rank assets by failure probability alone. We built a
    directed graph traversal over the grid topology that computes how many
    customers and which critical loads (hospitals, water treatment) would lose
    power if each asset failed, then applied a live weather multiplier from
    Open-Meteo so that an incoming storm automatically escalates all asset
    priorities. The result changes the output from "Transformer X will fail"
    to "Transformer X failing will drop a hospital during a storm — send a
    crew now." Judges should read docs/bob-demo.md to see this in action
    through Bob's MCP tool calls with real live output.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The predictive model is trained on a synthetic dataset of 2,250 rows
    across 25 simulated assets due to hackathon time constraints; a production
    deployment would use real SCADA telemetry. The grid topology uses
    pre-generated static coordinates rather than real GIS data. The watsonx.ai
    narrative layer falls back to a structured template stub when credentials
    are not provided, though the stub still references real asset IDs and
    scores. The crew optimizer uses a greedy nearest-crew heuristic rather
    than a globally-optimal assignment algorithm.

