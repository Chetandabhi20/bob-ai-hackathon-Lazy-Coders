# nixpacks.toml — Build configuration for Railway

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  # Create a venv (Nix Python is immutable — PEP 668 blocks direct pip install)
  "python3 -m venv /opt/venv",
  # Install Python dependencies inside the venv
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r src/requirements.txt",
  # Node.js dependencies + production build of the React frontend
  "cd src/frontend && npm ci && npm run build",
  # Save path to the Nix-built libstdc++ (compatible with Nix glibc 2.37).
  # The apt version requires glibc 2.38 and won't work.
  "dirname $(find /nix/store -path '*/gcc-*/lib/libstdc++.so.6' -print -quit) > /opt/nix-lib-path"
]

[start]
cmd = "export LD_LIBRARY_PATH=$(cat /opt/nix-lib-path):$LD_LIBRARY_PATH && cd src && /opt/venv/bin/python -m api.server"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "src"
