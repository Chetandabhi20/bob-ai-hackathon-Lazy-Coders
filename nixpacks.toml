# nixpacks.toml — Build configuration for Railway
# Railway uses Nixpacks to detect and build the project automatically.
# This file overrides defaults so both Python and Node.js are available
# in the same build, letting us: pip install → npm build → start FastAPI.

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  # Python dependencies
  "python3 -m pip install -r src/requirements.txt",
  # Node.js dependencies + production build of the React frontend
  "cd src/frontend && npm ci && npm run build"
]

[start]
cmd = "cd src && python -m api.server"

[variables]
# Railway injects PORT automatically; we read it in api/server.py
PYTHONUNBUFFERED = "1"
PYTHONPATH = "src"
