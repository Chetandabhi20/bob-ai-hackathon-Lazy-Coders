# nixpacks.toml — Build configuration for Railway

[phases.setup]
nixPkgs = ["python311", "nodejs_22"]

[phases.install]
cmds = [
  # Create a venv (Nix Python is immutable — PEP 668 blocks direct pip install)
  "python3 -m venv /opt/venv",
  # Install Python dependencies inside the venv
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r src/requirements.txt",
  # Node.js dependencies + production build of the React frontend
  "cd src/frontend && npm ci && npm run build"
]

[start]
cmd = "cd src && /opt/venv/bin/python -m api.server"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "src"
